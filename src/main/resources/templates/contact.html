	<style>
		.contact-us .inner{
	box-shadow: 0px 0px 10px #00000024;
	border-radius: 5px;
	overflow:hidden;
}
.contact-us .contact-us-left{
    width: 100%;
    height: 100%;
}
.contact-us .contact-us-form{
	padding:50px 40px;
}
.contact-us .contact-us-form h2 {
	position: relative;
	font-size: 32px;
	color: #333;
	font-weight: 600;
	line-height: 27px;
	text-transform: capitalize;
	margin-bottom: 12px;
	padding-bottom: 20px;
	text-align: left;
}
.contact-us .contact-us-form h2:before{
	position:absolute;
	content:"";
	left:0;
	bottom:0;
	height:2px;
	width:50px;
	background:#508cc9;
}
.contact-us .contact-us-form p {
	font-size: 14px;
	color: #333;
	font-weight: 400;
	text-align: left;
	margin-bottom:50px;
}
.contact-us .form {
	margin-top: 30px;
	
}
.contact-us .form .form-group {
	margin-bottom: 22px;
}
.contact-us .form .form-group input {
	width: 100%;
	height: 50px;
	box-shadow: 0 0 15px rgba(30, 144, 255, 0.7), 0 0 25px rgba(30, 144, 255, 0.5);
	text-transform: capitalize;
	padding: 0px 18px;
	color: #555;
	font-size: 14px;
	font-weight: 400;
	border-radius: 4px;
}
.contact-us .form .form-group textarea {
	width: 100%;
	height:100px;
	border: 1px solid #eee;
	text-transform: capitalize;
	padding:18px;
	color: #555;
	font-size: 14px;
	font-weight: 400;
	border-radius: 4px;
	box-shadow: 0 0 15px rgba(30, 144, 255, 0.7), 0 0 25px rgba(30, 144, 255, 0.5);
}
.contact-us .form .form-group.login-btn {
	margin: 0;
}
.contact-us .form button {
	border: none;
}
.contact-us .form .btn {
	display: inline-block;
	margin-right: 10px;
	color: #fff;
	line-height: 20px;
	width:100%;
}
.contact-us .form .btn:hover{
	background:#8a1538;
	color:#fff;
}
.contact-us .contact-us-form .checkbox {
	text-align: left;
	margin: 0;
	margin-top: 20px;
	display:inline-block;
	
}
.contact-us .contact-us-form .checkbox label {
	font-size: 14px;
	font-weight: 400;
	color: #333;
	position: relative;
	padding-left: 20px;
}
.contact-us .contact-us-form .checkbox label:hover{
	cursor:pointer;
}
.contact-us .contact-us-form .checkbox label input{
	display:none;
}
.contact-us .contact-us-form .checkbox label::before {
	position: absolute;
	content: "";
	left: 0;
	top: 5px;
	width: 15px;
	height: 15px;
	border: 1px solid #8a1538;
	border-radius: 100%;
}
.contact-us .contact-us-form .checkbox label::after {
	position: relative;
	content: "";
	width: 7px;
	height: 7px;
	left: -16px;
	top: -15px;
	opacity: 0;
	visibility: hidden;
	transform: scale(0);
	-webkit-transition: all 0.4s ease;
	-moz-transition: all 0.4s ease;
	transition: all 0.4s ease;
	display: block;
	font-size: 9px;
	background: #8a1538;
	border-radius: 100%;
}
.contact-us .contact-us-form .checkbox label.checked::after{
	opacity:1;
	visibility:visible;
	transform:scale(1);
}
.contact-us .contact-info{
	margin-top:50px;
}
.contact-us .single-info {
	background: #8a1538;
	padding: 40px 60px;
	height: 150px;
	border-radius: 10px;
	position:relative;
	-webkit-transition: all .3s ease-out 0s;
    -moz-transition: all .3s ease-out 0s;
    -ms-transition: all .3s ease-out 0s;
    -o-transition: all .3s ease-out 0s;
    transition: all .3s ease-out 0s;
}
.contact-us .single-info:before{
	position: absolute;
    z-index: -1;
    content: '';
    bottom: -10px;
    left: 0;
    right: 0;
    margin: 0 auto;
    width: 80%;
    height: 90%;
    background:#red;
    opacity: 0;
    filter: blur(10px);
    -webkit-transition: all .3s ease-out 0s;
    -moz-transition: all .3s ease-out 0s;
    -ms-transition: all .3s ease-out 0s;
    -o-transition: all .3s ease-out 0s;
    transition: all .3s ease-out 0s;
}
.contact-us .single-info:hover:before{
	opacity: 0.8;
}
.contact-us .single-info:hover{
	transform: translateY(-5px);
}
.contact-us .single-info i{
	font-size:42px;
	color:#fff;
	position:absolute;
	left:40px;
}
/* Container */
.contact-us-form {
    background: #ffffff;
    padding: 35px 30px;
    border-radius: 16px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    border: 1px solid #eaeaea;
    transition: 0.3s ease;
}

.contact-us-form:hover {
    box-shadow: 0 12px 28px rgba(0,0,0,0.12);
}

/* Title */
.contact-us-form h2 {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 12px;
    color: #333;
}

/* Subtitle */
.contact-us-form p {
    font-size: 15px;
    color: #666;
    margin-bottom: 25px;
}

/* Input + Textarea */
.contact-us-form input,
.contact-us-form textarea {
    width: 100%;
    padding: 14px 16px;
    border-radius: 10px;
    border: 1.5px solid #ddd;
    font-size: 15px;
    background: #fafafa;
    transition: 0.25s;
}

.contact-us-form input:focus,
.contact-us-form textarea:focus {
    border-color: #8a1538;   /* Burgundy for your brand */
    background: #fff;
    box-shadow: 0 0 8px rgba(138, 21, 56, 0.2);
    outline: none;
}

/* Textarea height */
.contact-us-form textarea {
    min-height: 140px;
    resize: vertical;
}

/* Button */
.contact-us-form .btn {
    background: #8a1538; /* Burgundy */
    color: white;
    border: none;
    padding: 14px 22px;
    font-size: 16px;
    border-radius: 10px;
    width: 100%;
    transition: 0.3s;
    font-weight: 600;
}

.contact-us-form .btn:hover {
    background: #6e102d;
    box-shadow: 0 6px 18px rgba(138, 21, 56, 0.25);
}

.contact-us .single-info .content {
	margin-left: 45px;
}
.contact-us .single-info .content h3{
	color:#fff;
	font-size:18px;
	font-weight:600;
	
}
.contact-us .single-info .content p{
	color:#fff;
	margin-top:5px;
}/* Google Map */
.contact-us #myMap {
	height: 100%;
	width: 100%;
}
.breadcrumbs.overlay::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(65, 141, 218, 0.625); /* Adjust the opacity */
    z-index: 1;
}
.breadcrumbs .bread-inner h2,.bread-list {
    color: white;z-index: 3;padding: 10px 20px;position: relative;
}
#mMap {
    width: 100%;
    height: 100%; /* Increase the height for a longer map */
    border: 3px solid #1a76d1; /* Add a black border around the map */
    border-radius: 8px;
   /* Ensures a decent height for the map */
}

	</style>

		<!-- Start Contact Us -->
		<section class="contact-us section">
			<div class="container">
				<div class="inner">
					<div class="row"> 

						<div class="col-lg-6 offset-lg-3 col-md-8 offset-md-2 col-sm-10 offset-sm-1">

							<div class="contact-us-form">
								<h2>Contactez nous</h2>
								<p>Si vous avez une remarque ou une question , n'hesitez pas de nous informer.</p>
								<!-- Form -->
								<form id="noteForm" action="#" th:action="@{/saveNote}" th:object="${note}" method="post">
									<div class="row">
										<div class="col-lg-6">
											<div class="form-group">
												<input type="text" name="nom" id="nom" th:field="*{nom}" placeholder="Nom" required="">
											</div>
										</div>
										<div class="col-lg-6">
											<div class="form-group">
												<input type="text" name="email" id="email" th:field="*{email}" placeholder="Email" >
											</div>
										</div>

										<div class="col-lg-12">
											<div class="form-group">
												<textarea name="message" id="message" th:field="*{message}"  placeholder="Votre message" required=""></textarea>
											</div>
										</div>
										<div class="col-12">
											<div class="form-group login-btn">
												<button class="btn" type="submit">Envoyer</button>
											</div>
										</div>
									</div>
								</form>
								<!--/ End Form -->
							</div>
						</div>
					</div>
				</div>
				<div class="contact-info">
					<div class="row">
						<!-- single-info -->
						<div class="col-lg-4 col-12 ">
							<div class="single-info">
								<i class="icofont icofont-ui-call"></i>
								<div class="content">
								<h3>96424436</h3>
									<p>CasaMobilia@gmail.com</p>
								</div>
							</div>
						</div>
						<!--/End single-info -->
						<!-- single-info -->
						<div class="col-lg-4 col-12 ">
							<div class="single-info">
								<i class="icofont-google-map"></i>
								<div class="content">
									<h3>Monastir</h3>
									<p>Avenue Omrane</p>
								</div>
							</div>
						</div>
						<!--/End single-info -->
						<!-- single-info -->
						<div class="col-lg-4 col-12 ">
							<div class="single-info">
								<i class="icofont icofont-wall-clock"></i>
								<div class="content">
									<h3>Lundi - Samedi : 8am - 7pm</h3>
									<p>Dimanche ferme</p>
								</div>
							</div>
						</div>
						<!--/End single-info -->
					</div>
				</div>
